<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Investor Tracker - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#3b82f6; --primary-soft:#dbeafe;
  --amber:#f59e0b; --amber-soft:#fef3c7;
  --success:#16a34a; --success-soft:#dcfce7;
  --danger:#e11d48; --danger-soft:#ffe4e6;
  --bg:#f4f6fb; --surface:#ffffff; --line:#e5e7eb;
  --text-main:#111827; --muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text-main);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{padding:18px 16px 14px;background:linear-gradient(135deg,var(--primary),#2563eb);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(37,99,235,.25)}
.header h1{margin:0;font-size:19px;font-weight:800}
.header .sub{font-size:12px;opacity:.85;margin-top:2px}
.content{padding:14px 14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.card.pad{padding:16px}
.title{font-weight:800;font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.tiny{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-family:inherit;background:#fff;color:var(--text-main)}
.input:focus{outline:none;border-color:var(--primary)}
select.input{appearance:none}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#eef2ff;color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff}
.btn.amber{background:var(--amber-soft);color:#92400e}
.btn.success{background:var(--success-soft);color:#166534}
.btn.red{background:var(--danger-soft);color:var(--danger)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.chip.active{background:var(--success-soft);color:#166534}
.chip.closed{background:#f1f5f9;color:#475569}
.stat-val{font-size:20px;font-weight:800}
.stat-label{font-size:11px;color:var(--muted);font-weight:700}
.sep{height:1px;background:var(--line);margin:12px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.04)}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.active{color:var(--primary)}
.tab i{font-size:17px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:900}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-60px);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:1200;transition:transform .25s ease;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.pin-dots{display:flex;gap:12px;margin:10px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pin-dot.filled{background:var(--primary)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,64px);gap:14px}
.pin-key{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.pin-key.wide{grid-column:span 1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:1300}
.loading.show{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div class="spin"></div></div>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
