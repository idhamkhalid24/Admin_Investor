<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Investor Tracker - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#FDE047; --primary-soft:#FEF08A; /* Vibrant Yellow */
  --amber:#F59E0B; --amber-soft:#FDE68A;
  --success:#4ADE80; --success-soft:#bbf7d0; /* Vibrant Green */
  --danger:#F87171; --danger-soft:#fecaca; /* Vibrant Red */
  --blue:#60A5FA; --blue-soft:#bfdbfe;
  --bg:#F4F0EB; --surface:#ffffff; --line:#000000;
  --text-main:#000000; --muted:#4B5563;
  --neo-shadow: none;
  --neo-shadow-hover: none;
  --neo-border: 3px solid #000000;
  --radius: 8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text-main);-webkit-tap-highlight-color:transparent; font-weight: 600;}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px;background:var(--bg);}
.header{padding:20px 16px;background:var(--primary);color:#000;border-bottom:var(--neo-border); margin-bottom:12px; position: sticky; top:0; z-index:50;}
.header h1{margin:0;font-size:22px;font-weight:800; text-transform:uppercase; letter-spacing:-0.5px;}
.header .sub{font-size:13px;font-weight:700;margin-top:4px}
.content{padding:14px 14px 0}
.card{background:var(--surface);border:var(--neo-border);border-radius:var(--radius);padding:14px;margin-bottom:16px;transition:transform 0.2s;}
.card.pad{padding:16px}
.title{font-weight:800;font-size:16px; text-transform:uppercase;}
.meta{font-size:12px;color:var(--muted);margin-top:4px; font-weight:700;}
.tiny{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.input{width:100%;padding:12px 14px;border-radius:var(--radius);border:var(--neo-border);font-size:14px;font-family:inherit;font-weight:700;background:#fff;color:var(--text-main); transition: all 0.1s;}
.input:focus{outline:none;background:#fefce8; transform: translate(1px, 1px);}
select.input{appearance:none}
.btn{border:var(--neo-border);border-radius:var(--radius);padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue-soft);color:#000;transition:all 0.1s ease-in-out; text-transform:uppercase; font-family:inherit;}
.btn.primary{background:var(--primary);color:#000;}
.btn.amber{background:var(--amber);color:#000;}
.btn.success{background:var(--success);color:#000;}
.btn.err{background:var(--danger);color:#000;}
.btn.red{background:var(--danger);color:#000;}
.btn.full{width:100%}
.btn:hover, .btn:active{transform:translate(2px, 2px);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn.sm{padding:8px 12px;font-size:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--radius);border: 2px solid #000;}
.chip.active{background:var(--success);color:#000}
.chip.closed{background:#d1d5db;color:#000}
.stat-val{font-size:24px;font-weight:800;}
.stat-label{font-size:12px;color:var(--text-main);font-weight:800;text-transform:uppercase;}
.sep{height:3px;background:var(--line);margin:16px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:var(--neo-border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:100;}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;}
.tab.active{color:#000;background:var(--primary);border-radius:var(--radius);border:2px solid #000; transform: translateY(-4px);}
.tab i{font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:900;backdrop-filter:blur(2px);}
.modal.show{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border-top:var(--neo-border);border-left:var(--neo-border);border-right:var(--neo-border);padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.empty{text-align:center;font-weight:800;color:var(--text-main);font-size:14px;padding:30px 10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#000;color:#fff;padding:12px 24px;border-radius:var(--radius);border:var(--neo-border);font-size:14px;font-weight:800;z-index:1200;transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#000;}
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;background:var(--primary);}
.pin-dots{display:flex;gap:14px;margin:16px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #000;background:#fff;}
.pin-dot.filled{background:#000;}
.pin-keypad{display:grid;grid-template-columns:repeat(3,70px);gap:16px}
.pin-key{width:70px;height:70px;border-radius:var(--radius);border:var(--neo-border);background:#fff;font-size:24px;font-weight:800;cursor:pointer;transition:all 0.1s;font-family:inherit;}
.pin-key:active{transform:translate(2px, 2px);}
.pin-key.wide{grid-column:span 1}
.loading{position:fixed;inset:0;background:rgba(244,240,235,.8);display:none;align-items:center;justify-content:center;z-index:1300}
.loading.show{display:flex}
.spin{width:40px;height:40px;border:5px solid #000;border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { white-space: nowrap; padding: 12px 16px !important; border-bottom: 2px solid #000; }
th { background: var(--primary-soft); font-weight: 800; border-bottom: 3px solid #000; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div class="spin"></div></div>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
